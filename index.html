<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>혜성여고 교칙 안내</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, "Noto Sans KR", sans-serif;
  background: #f5f7fb;
  color: #172033;
}

header {
  background: white;
  padding: 22px 20px;
  border-bottom: 1px solid #e7eaf0;
  position: sticky;
  top: 0;
  z-index: 10;
}

.header-inner {
  max-width: 900px;
  margin: auto;
  font-size: 20px;
  font-weight: 800;
  color: #1d3557;
}

.hero {
  max-width: 900px;
  margin: 45px auto 25px;
  padding: 0 20px;
}

.hero h1 {
  font-size: 38px;
  margin-bottom: 12px;
  color: #172033;
}

.hero p {
  color: #687386;
  line-height: 1.6;
}

.search-box {
  max-width: 900px;
  margin: 0 auto 30px;
  padding: 0 20px;
}

.search-box input {
  width: 100%;
  padding: 17px 20px;
  border: 1px solid #dfe4ec;
  border-radius: 15px;
  font-size: 16px;
  outline: none;
  background: white;
}

.search-box input:focus {
  border-color: #668dc5;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 0 20px 50px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 18px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 24px;
  border: 1px solid #e8ebf1;
  cursor: pointer;
  transition: 0.2s;
}

.card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 25px rgba(30, 50, 80, 0.08);
}

.icon {
  font-size: 27px;
  margin-bottom: 13px;
}

.card h2 {
  margin: 0 0 8px;
  font-size: 20px;
}

.card p {
  margin: 0;
  color: #707b8d;
  line-height: 1.5;
  font-size: 14px;
}

.detail {
  display: none;
  margin-top: 18px;
  background: #f8faff;
  border-radius: 16px;
  padding: 20px;
  line-height: 1.7;
  color: #3d485b;
}

.detail.show {
  display: block;
}

.detail ul {
  padding-left: 20px;
  margin: 5px 0 0;
}

.detail li {
  margin-bottom: 9px;
}

.section-title {
  margin-top: 18px;
  margin-bottom: 6px;
  font-weight: 800;
}

.plus {
  color: #247a4b;
  font-weight: 700;
}

.minus {
  color: #c44747;
  font-weight: 700;
}

.close {
  margin-top: 15px;
  border: none;
  background: #1d3557;
  color: white;
  padding: 9px 15px;
  border-radius: 10px;
  cursor: pointer;
}

.notice {
  margin-top: 25px;
  background: #eef4fc;
  border-radius: 16px;
  padding: 18px;
  color: #53647d;
  font-size: 13px;
  line-height: 1.6;
}

footer {
  text-align: center;
  padding: 25px;
  color: #8a93a2;
  font-size: 12px;
}

@media (max-width: 650px) {
  .cards {
    grid-template-columns: 1fr;
  }

  .hero h1 {
    font-size: 30px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">혜성여고 교칙 안내</div>
</header>

<section class="hero">
  <h1>학생들을 위한<br>교칙 안내</h1>
  <p>
    복잡한 학교생활 규정을 학생들이 쉽게 확인할 수 있도록 정리했어요.
